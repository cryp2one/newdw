name: YouTube Downloader (Stable)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: true
        type: string
      split_size:
        description: "Split size in MB (0 = no split)"
        required: false
        default: "90"
        type: string

permissions:
  contents: write

jobs:
  ytdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system packages and set Python
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg ca-certificates git

          # انتخاب Python (اولویت با 3.12)
          if command -v python3.12 >/dev/null 2>&1; then
            PY=python3.12
          else
            sudo apt-get install -y python3.11 python3.11-venv
            PY=python3.11
          fi

          echo "Using Python: $PY"
          echo "PY=$PY" >> $GITHUB_ENV
        shell: bash

      - name: Create venv and install dependencies
        run: |
          $PY -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install yt-dlp requests curl_cffi
        shell: bash

      - name: Download via Piped proxy
        run: |
          source .venv/bin/activate
          mkdir -p youtube
          cd youtube

          yt-dlp \
            --proxy "https://pipedapi.syncpundit.com" \
            --extractor-args "youtube:player_client=android,web" \
            --merge-output-format mp4 \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best" \
            --no-warnings \
            "${{ github.event.inputs.url }}"
        shell: bash

      - name: Split files if needed
        run: |
          source .venv/bin/activate
          cd youtube
          SIZE=${{ github.event.inputs.split_size }}
          
          if [ "$SIZE" -gt 0 ]; then
            for f in *.mp4; do
              if [ -f "$f" ]; then
                echo "Splitting $f into ${SIZE}MB parts..."
                split -b ${SIZE}M "$f" "${f%.mp4}_part_"
                rm "$f"
              fi
            done
          fi
        shell: bash

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          
          if git diff --quiet youtube/; then
            echo "No new files to commit"
          else
            git add youtube/
            git commit -m "Downloaded YouTube video - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ Video downloaded and committed"
          fi
        shell: bash
