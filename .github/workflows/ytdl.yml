name: YouTube Downloader (Stable)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: true
        type: string
      split_size:
        description: "Split size in MB (0 = no split)"
        required: false
        default: "90"
        type: string

permissions:
  contents: write

jobs:
  ytdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Force single Python version + install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install yt-dlp requests curl_cffi

      - name: Download via Piped proxy
        run: |
          mkdir -p youtube
          cd youtube
          python3 -m yt_dlp \
            --proxy "https://pipedapi.syncpundit.com" \
            --extractor-args "youtube:player_client=android" \
            --merge-output-format mp4 \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4" \
            "${{ github.event.inputs.url }}"

      - name: Split files if needed
        run: |
          cd youtube
          SIZE=${{ github.event.inputs.split_size }}
          if [ "$SIZE" -gt 0 ]; then
            for f in *.mp4; do
              if [ -f "$f" ]; then
                split -b ${SIZE}M "$f" "${f}_part_"
                rm "$f"
              fi
            done
          fi

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add youtube
          git commit -m "Downloaded YouTube video" || echo "No changes"
          git push
