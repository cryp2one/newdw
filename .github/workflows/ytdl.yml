name: YouTube Downloader (Stable)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: true
        type: string
      split_size:
        description: "Split size in MB (0 = no split)"
        required: false
        default: "90"
        type: string

permissions:
  contents: write

jobs:
  ytdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system packages and choose Python
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg ca-certificates
          # Try to install python3.12; if not available, fall back to python3.11
          if sudo apt-get install -y python3.12 >/dev/null 2>&1; then
            PY=python3.12
          else
            sudo apt-get install -y python3.11 python3.11-venv
            PY=python3.11
          fi
          echo "Using interpreter: $PY"

      - name: Create and activate virtualenv, install deps
        run: |
          # create venv in workspace (no sudo, no system pip changes)
          $PY -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install yt-dlp requests curl_cffi

      - name: Download via Piped proxy (inside venv)
        run: |
          source .venv/bin/activate
          mkdir -p youtube
          cd youtube
          python -m yt_dlp \
            --proxy "https://pipedapi.syncpundit.com" \
            --extractor-args "youtube:player_client=android" \
            --merge-output-format mp4 \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4" \
            "${{ github.event.inputs.url }}"

      - name: Split files if needed
        run: |
          source .venv/bin/activate
          cd youtube
          SIZE=${{ github.event.inputs.split_size }}
          if [ "$SIZE" -gt 0 ]; then
            for f in *.mp4; do
              if [ -f "$f" ]; then
                split -b ${SIZE}M "$f" "${f}_part_"
                rm "$f"
              fi
            done
          fi

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add youtube
          git commit -m "Downloaded YouTube video" || echo "No changes"
          git push
