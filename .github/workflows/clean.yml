name: Clean Downloads Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Remove downloads folder
        run: |
          rm -rf downloads
          mkdir downloads

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add downloads
          git commit -m "Cleaned downloads folder" || echo "No changes"
          git push
