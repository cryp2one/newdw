name: Download & Split

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated list of URLs"
        required: true
        type: string
      split_size:
        description: "Split size in MB (0 = no split)"
        required: false
        default: "90"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download files
        run: |
          mkdir -p downloads
          cd downloads
          for url in ${{ github.event.inputs.urls }}; do
            echo "Downloading $url"
            aria2c -x 16 -s 16 "$url"
          done

      - name: Split files if needed
        run: |
          cd downloads
          SIZE=${{ github.event.inputs.split_size }}
          if [ "$SIZE" -gt 0 ]; then
            for f in *; do
              if [ -f "$f" ]; then
                echo "Checking $f"
                if [ $(stat -c%s "$f") -gt $((SIZE * 1024 * 1024)) ]; then
                  echo "Splitting $f"
                  split -b ${SIZE}M "$f" "${f}_part_"
                  rm "$f"
                fi
              fi
            done
          fi

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add downloads
          git commit -m "Downloaded & split files" || echo "No changes"
          git push
